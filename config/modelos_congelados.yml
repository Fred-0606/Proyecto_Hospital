estado: congelado_previo_a_prueba
fecha_congelamiento: "2026-09-29"
prueba_final_abierta: false
random_state: 42
fecha_inicio_prueba: "2026-03-01"
metrica_seleccion: pr_auc
regla_seleccion: modelo_mas_simple_dentro_de_un_error_estandar
pliegues_temporales: 5

definiciones_operativas:
  carga_activa_b:
    instante: inmediatamente_antes_de_registrar_la_conducta
    excluye_paciente_actual: true
    pacientes_activos_en_ingreso: otros pacientes con ingreso previo cuya conducta aun no habia finalizado
    pacientes_pendientes_de_salida: otros pacientes con conducta previa y sin salida previa
    limitacion: solo se reconstruyen intervalos con marcas temporales completas y coherentes

modelos:
  A:
    objetivo: estancia_prolongada_a
    predictores:
      - edad
      - volumen_ingresos_3h
      - volumen_ingresos_6h
      - volumen_ingresos_24h
      - triage
      - afiliacion
      - hora_ingreso
      - dia_semana_ingreso
      - mes_ingreso
      - fin_semana_ingreso
    candidato: regresion_logistica
    clasificador:
      solver: saga
      C: 1.0
      l1_ratio: 0.5
      class_weight: null
      tol: 0.001
      max_iter: 1000
      random_state: 42
    umbral: 0.2817978707428111
    pr_auc_validacion: 0.612152707171726
    roc_auc_validacion: 0.600668449416629

  B:
    objetivo: estancia_prolongada_b
    predictores:
      - edad
      - pacientes_activos_en_ingreso
      - pacientes_pendientes_de_salida
      - duracion_ingreso_calculada
      - triage
      - afiliacion
      - sala_observacion
      - grupo_cama
      - conducta
      - hora_ingreso
      - dia_semana_ingreso
      - mes_ingreso
      - fin_semana_ingreso
      - hora_conducta
      - dia_semana_conducta
      - mes_conducta
      - fin_semana_conducta
      - especialidades_tratantes
    candidato: regresion_logistica
    clasificador:
      solver: saga
      C: 0.1
      l1_ratio: 0.0
      class_weight: null
      tol: 0.001
      max_iter: 1000
      random_state: 42
    umbral: 0.2776236062837081
    pr_auc_validacion: 0.6291958734999129
    roc_auc_validacion: 0.7935954487704086

